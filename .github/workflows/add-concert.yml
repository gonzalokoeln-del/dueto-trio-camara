name: Add Concert from Issue

on:
  issues:
    types: [opened]

jobs:
  add-concert:
    if: contains(github.event.issue.body, '### Fecha / Date')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse issue and update index.html
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 << 'PYEOF'
          import os, re, sys

          body = os.environ['ISSUE_BODY']

          def extract(body, header):
              m = re.search(rf'### {re.escape(header)}\s*\n\s*\n(.+?)(?=\n\n###|\Z)', body, re.DOTALL)
              if m:
                  val = m.group(1).strip()
                  return '' if val == '_No response_' else val
              return ''

          date_raw = extract(body, 'Fecha / Date')
          time_raw = extract(body, 'Hora / Time')
          name     = extract(body, 'Nombre del concierto / Concert name')
          venue    = extract(body, 'Lugar / Venue')

          if not date_raw or not name or not venue:
              print("Missing required fields — skipping")
              sys.exit(0)

          date_str = f"{date_raw} · {time_raw}" if time_raw else date_raw

          new_row = (
              f'    <div class="concert-row">'
              f'<p class="concert-date">{date_str}</p>'
              f'<p class="concert-event">{name}</p>'
              f'<p class="concert-venue">{venue}</p>'
              f'</div>\n'
          )

          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          marker = '    </div>\n    <div class="concert-row">'
          idx = content.find(marker)
          if idx == -1:
              print("ERROR: could not find insertion point")
              sys.exit(1)

          insert_at = idx + len('    </div>\n')
          content = content[:insert_at] + new_row + content[insert_at:]

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)

          print(f"Added: {name}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Add concert from issue #${{ github.event.issue.number }}"
          git push origin preview

      - name: Close issue and comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Concierto añadido a la web automáticamente.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
