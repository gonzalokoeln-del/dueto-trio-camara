name: Add Concert from Issue

on:
  issues:
    types: [opened]

jobs:
  add-concert:
    if: contains(github.event.issue.body, '### Fecha / Date')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse issue and update concerts.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'PYEOF'
          import os, re, sys, json

          body = os.environ['ISSUE_BODY']

          def extract(body, header):
              m = re.search(rf'### {re.escape(header)}\s*\n\s*\n(.+?)(?=\n\n###|\Z)', body, re.DOTALL)
              if m:
                  val = m.group(1).strip()
                  return '' if val == '_No response_' else val
              return ''

          date_raw = extract(body, 'Fecha / Date')
          time_raw = extract(body, 'Hora / Time')
          name     = extract(body, 'Nombre del concierto / Concert name')
          venue    = extract(body, 'Lugar / Venue')

          if not date_raw or not name or not venue:
              print('Missing required fields')
              sys.exit(0)

          # Parse date to YYYY-MM-DD
          MONTHS = {'enero':1,'febrero':2,'marzo':3,'abril':4,'mayo':5,'junio':6,
                    'julio':7,'agosto':8,'septiembre':9,'octubre':10,'noviembre':11,'diciembre':12,
                    'january':1,'february':2,'march':3,'april':4,'june':6,'july':7,
                    'august':8,'september':9,'october':10,'november':11,'december':12}
          parts = re.findall(r'[\w]+', date_raw.lower())
          day = year = month = None
          for p in parts:
              if p.isdigit() and int(p) > 31: year = int(p)
              elif p.isdigit() and int(p) <= 31: day = int(p)
              elif p in MONTHS: month = MONTHS[p]
          if not (day and month and year):
              print(f'Could not parse date: {date_raw}')
              sys.exit(1)
          date_iso = f'{year:04d}-{month:02d}-{day:02d}'

          # Parse time (strip 'h')
          time_str = re.sub(r'h.*', '', time_raw).strip() if time_raw else None

          with open('concerts.json', 'r', encoding='utf-8') as f:
              concerts = json.load(f)

          if any(c.get('event') == name for c in concerts):
              print(f'Already present: {name}')
              sys.exit(0)

          entry = {'date': date_iso, 'event': name, 'venue': venue}
          if time_str:
              entry['time'] = time_str

          concerts.insert(0, entry)

          with open('concerts.json', 'w', encoding='utf-8') as f:
              json.dump(concerts, f, ensure_ascii=False, indent=2)
              f.write('\n')

          print(f'Added: {name}')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add concerts.json
          git diff --staged --quiet || git commit -m "Add concert from issue #${{ github.event.issue.number }}"
          git push origin main

      - name: Close issue and comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Concierto añadido a la web automáticamente.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
